# 모듈 3 개인 과제 — RealSense 카메라 설정
# tracker.launch.py가 width/height/fps로 컬러 프로파일을 구성한다.
# 이번 과제에서는 Depth 스트림을 사용하지 않는다.
width: 640                                # 컬러·깊이 해상도 (가로)
height: 480                               # 컬러·깊이 해상도 (세로)
fps: 30                                   # 초당 프레임 (카메라 설정값 — 처리 FPS와 구분)
#color_profile: "640x480 @30fps, RGB8"     # wrapper: rgb_camera.color_profile:=640,480,30 (형식은 wrapper 기본 RGB8)
#depth_profile: "640x480 @30fps, Z16"      # wrapper: depth_module.depth_profile:=640,480,30, align_depth.enable:=true

# 아래 Topic 값은 RealSense wrapper 실행 후 `ros2 topic list` / `ros2 topic type`으로 확인해 기록함
# perception_node가 구독할 Raw Image 토픽
color_topic: "/camera/camera/color/image_raw"                       # sensor_msgs/msg/Image, encoding rgb8

# 아래 토픽은 원본 호환용으로 유지하며 이번 과제에서는 사용하지 않는다.
aligned_depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"  # sensor_msgs/msg/Image, encoding 16UC1 (1 = 1mm)
camera_info_topic: "/camera/camera/color/camera_info"               # sensor_msgs/msg/CameraInfo


# EYE4 팀플에서 검증한 기존 카메라 구성
# 개인 과제 실행 시 실제 토픽·해상도·QoS를 다시 확인한다.
# 아래 실측 기록은 팀 프로젝트의 기존 결과이며,
# 개인 과제의 실험 결과를 의미하지 않는다.

# ── 확인 기록 (2026-10-06, 인지 담당, 노트북 Ubuntu 24.04 + ROS 2 Lyrical) ──────────────────────────────
# 실행: ros2 launch realsense2_camera rs_launch.py align_depth.enable:=true \
#         rgb_camera.color_profile:=640,480,30 depth_module.depth_profile:=640,480,30
# 장치: Intel RealSense D435 (Product ID 0x0B07 — IMU 없는 D435, 발제문의 D435i 아님)
#       serial 261322071425, firmware 5.15.1.55
# 버전: RealSense ROS wrapper v4.57.7, LibRealSense v2.57.7 (ros-lyrical-realsense2-camera)
# USB : 3.2 (5000 Mbps) — 처음에는 2.1로 연결돼 wrapper가 성능 저하 경고 → USB 3 포트로 다시 연결해 확인 (발제문 기준 충족)
# frame_id: camera_color_optical_frame (컬러 영상·CameraInfo 동일), stamp: 영상마다 채워짐
# 정렬 깊이: 640x480, 16UC1
# CameraInfo: 640x480, plumb_bob, K = [607.571, 0, 327.340; 0, 607.530, 239.493; 0, 0, 1]
# 발행 QoS (컬러·정렬 깊이): RELIABLE, KEEP_LAST(1)
# 수신 실측 (6초, 다른 프로세스에서 구독, wrapper 시작 후 안정화된 뒤 측정):
#   USB 2.1: reliable 구독 → 컬러 29.4 fps, 정렬 깊이 29.4 fps / best effort 구독 → 1.2 fps, 0 fps
#   USB 3.2: reliable 구독 → 컬러 29.6 fps, 정렬 깊이 29.5 fps / best effort 구독 → 1.5 fps, 0.2 fps
#   → USB 속도와 관계없이 best effort로는 영상이 거의 전달되지 않음 → 영상 구독은 reliable 사용
